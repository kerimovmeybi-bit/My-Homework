<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Shop</title>
    <link rel="stylesheet" href="./css/stules.css">
</head>

<body>
    <header class="header">
        <div class="nav-container">
            <img class="my-image" src="images/Logo.png" alt="logo">
            <a href="#" target="_blank" class="nav_link link-underline">Home</a>
            <a href="#" target="_blank" class="nav_link">Shop</a>
            <a href="#" target="_blank" class="nav_link">Plant Care</a>
            <a href="#" target="_blank" class="nav_link">Blogs</a>
            <button class="my-button">
                <img class="my-logo" src="images/Logout.png" alt="logo">
                <a class="a" href="#" target="_blank">
                    Login
                </a>
            </button>
        </div>
    </header>
    <main class="banner">
        <div>
            <p class="main-title">Welcome to GreenShop</p>
        </div>
        <div class="big-text">
            LET'S MAKE A <br>
            BETTER <span class="highlight">PLANET</span>
        </div>
        <div class="p-content">
            <p class="content">
                We are an online plant shop offering a wide range of cheap and trendy plants. Use our plants to
                create an unique Urban Jungle. Order your favorite plants!
            </p>
        </div>
        <div class="my-btn">
            <button class="my-button-a">
                <a class="a" href="#" target="_blank">
                    SHOP NOW
                </a>
            </button>
        </div>
        <div class="div-image">
            <img class="image" src="images/01_image.png" alt="image">
        </div>
        <div class="div">
            <img class="image-image" src="images/02_image.png" alt="image">
        </div>
    </main>
</body>

</html>
