<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="./css/reset200802.css">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/styles.css">
    <style>
    </style>
</head>

<body>
    <main>
        <div class="container" style="max-width: 850px; margin: auto;">
            <form class="form">
                <section>
                    <p class="p">
                        <a class="link" href="Login.html" target="_blank"
                            style="width: 50%; color: rgb(15, 1, 1);  font-size: larger;">
                            <b>Login.</b>
                        </a>
                        <a style="width: 50%; color: rgb(78, 150, 7);font-size:larger;">
                            <b>Register</b>
                        </a>
                    </p>
                </section>
                <section>
                    <p style="text-align:center;margin:auto">Enter your email and password to register.</p>
                    <p><input type="text" class="my-input" placeholder="Username"></p>
                    <p><input type="email" class="my-input" placeholder="Enter your email address"></p>
                    <p><input type="Password" class="my-input" placeholder="Password"></p>
                </section>
                <section>
                    <p>
                        <button type="submit">
                            <img class="img" src="Images/Button.png" alt width="300">
                        </button>
                    </p>
                </section>
                <section>
                    <p style="text-align: center;margin: auto;">Or register with.</p>
                </section>
                <section>
                    <p>
                        <a href="https://myaccount.google.com" target="_blank">
                            <img src="Images/Google.png" height="35" alt="solid">
                        </a>
                    </p>
                    <p>
                        <a href="https://www.facebook.com/?locale=ru_RU" target="_blank">
                            <img src="Images/Facebook.png" height="35" alt="solid">
                        </a>
                    </p>
                </section>
            </form>
        </div>
    </main>
</body>

</html>
