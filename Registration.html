<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./fronts/stylesheet.css">
</head>

<body class="container-registration">
    <a href="#" target="_blank">
        <img src="./images/Frame-1.svg" alt="icon" class="icon-registration">
    </a>
    <div class="content-registration">
        <a href="#" target="_blank" class="link-registration">
            Login I <span style="color: #46A358;">Register</span>
        </a>
        <p>Enter your email and password to register.</p>
        <input placeholder="Username" type="text" class="input">
        <input placeholder="Enter your email address" class="input">
        <input type="Password" placeholder="Password" name="Password" class="input">
        <a href="#" target="_blank" class="my-btn-registration">
            Register
        </a>
        <p>Or register with</p>
        <a href="#" target="_blank" class="google">
            <img src="./images/google-1.svg" alt="icon" class="icon-register">
            Continue with Google
        </a>
        <a href="#" target="_blank" class="google">
            <img src="./images/facebook-1.svg" alt="icon" class="icon-facebook">
            Continue with Facebook
        </a>

    </div>

</body>

</html>
