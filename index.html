<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./fonts/stylesheet.css">
</head>

<body>
    <header class="nav-menu">
        <a href="#" target="_blank" class="nav-link">All Plants</a>
        <a href="#" target="_blank" class="nav-link">New Arrivals</a>
        <a href="#" target="_blank" class="nav-link">Sale</a>
        <div class="sort-box">
            <label for="sort">Short by:</label>
            <select id="sort" name="sort">
                <option value="default">Default sorting</option>
                <option value="price">Price</option>
                <option value="name">Name</option>
                <option value="rating">Rating</option>
            </select>
        </div>
    </header>
    <main>
        <div class="cards-wrap">
            <div class="card-item">
                <a href="#" target="_blank">
                    <img src="./images/image_1.png" alt="image.png" class="card-img">
                </a>
                <div class="icons">
                    <a href="#" target="_blank">
                        <img src="./images/shopping.png" alt="shopping">
                    </a>
                    <a href="#" target="_blank">
                        <img src="./images/heart.png" alt="heart">
                    </a>
                    <a href="#" target="_blank">
                        <img src="./images/Vector.png" alt="Vector">
                    </a>
                </div>
                <p class="card-title">Barberton Daisy</p>
                <h4 class="how-much">$119.00</h4>
            </div>
            <div class="card-item">
                <a href="#" target="_blank">
                    <img src="./images/image_2.png" alt="image.png" class="card-img">
                </a>
                <div class="icons">
                    <a href="#" target="_blank">
                        <img src="./images/shopping.png" alt="shopping">
                    </a>
                    <a href="#" target="_blank">
                        <img src="./images/heart.png" alt="heart">
                    </a>
                    <a href="#" target="_blank">
                        <img src="./images/Vector.png" alt="Vector">
                    </a>
                </div>
                <p class="card-title">Angel Wing Begonia</p>
                <h4 class="how-much">$169.00</h4>
            </div>
            <div class="card-item">
                <button class="btn" type="button">
                    <p class="discount">13% OFF</p>
                </button>
                <a href="#" target="_blank">
                    <img src="./images/image_3.png" alt="image.png" class="card-img">
                </a>
                <div class="icons">
                    <a href="#" target="_blank">
                        <img src="./images/shopping.png" alt="shopping">
                    </a>
                    <a href="#" target="_blank">
                        <img src="./images/heart.png" alt="heart">
                    </a>
                    <a href="#" target="_blank">
                        <img src="./images/Vector.png" alt="Vector">
                    </a>
                </div>
                <p class="card-title">African Violet</p>
                <h4 class="how-much">$119.00</h4>
                <h4 class="old-price">$229.00</h4>
            </div>
        </div>



    </main>
</body>

</html>
